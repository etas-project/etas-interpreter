[workspace]
members = ["crates/etas_interpreter"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/etas-project/etas-interpreter"

[workspace.dependencies]
etas_core = { git = "https://github.com/etas-project/etas-core.git", rev = "e90bc3e5506aaff13d4b81a527228d8a7e108bfa", package = "etas_core" }
etas_code = { git = "https://github.com/etas-project/etas-core.git", rev = "e90bc3e5506aaff13d4b81a527228d8a7e108bfa", package = "etas_code" }
etas_builtin = { git = "https://github.com/etas-project/etas-core.git", rev = "e90bc3e5506aaff13d4b81a527228d8a7e108bfa", package = "etas_builtin" }
etas_host = { git = "https://github.com/etas-project/etas-core.git", rev = "e90bc3e5506aaff13d4b81a527228d8a7e108bfa", package = "etas_host" }
etas_std = { git = "https://github.com/etas-project/etas-core.git", rev = "e90bc3e5506aaff13d4b81a527228d8a7e108bfa", package = "etas_std" }
etas_utils = { git = "https://github.com/etas-project/etas-core.git", rev = "e90bc3e5506aaff13d4b81a527228d8a7e108bfa", package = "etas_utils" }
etas_frontend = { git = "https://github.com/etas-project/etas-frontend.git", rev = "0283a9c7b7a45f7ccd0cd1d0e73e035b8c77d256", package = "etas_frontend" }
etas_hir = { git = "https://github.com/etas-project/etas-frontend.git", rev = "0283a9c7b7a45f7ccd0cd1d0e73e035b8c77d256", package = "etas_hir" }
etas_effects = { git = "https://github.com/etas-project/etas-frontend.git", rev = "0283a9c7b7a45f7ccd0cd1d0e73e035b8c77d256", package = "etas_effects" }
etas_types = { git = "https://github.com/etas-project/etas-frontend.git", rev = "0283a9c7b7a45f7ccd0cd1d0e73e035b8c77d256", package = "etas_types" }
blake3 = "1.8.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
