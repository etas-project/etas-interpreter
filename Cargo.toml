[workspace]
members = ["crates/etas_interpreter"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/etas-project/etas-interpreter"

[workspace.dependencies]
etas_core = { git = "https://github.com/etas-project/etas-core.git", rev = "38d6491c565def47cf926b435dc5b5f87af30844", package = "etas_core" }
etas_code = { git = "https://github.com/etas-project/etas-core.git", rev = "38d6491c565def47cf926b435dc5b5f87af30844", package = "etas_code" }
etas_builtin = { git = "https://github.com/etas-project/etas-core.git", rev = "38d6491c565def47cf926b435dc5b5f87af30844", package = "etas_builtin" }
etas_host = { git = "https://github.com/etas-project/etas-core.git", rev = "38d6491c565def47cf926b435dc5b5f87af30844", package = "etas_host" }
etas_std = { git = "https://github.com/etas-project/etas-core.git", rev = "38d6491c565def47cf926b435dc5b5f87af30844", package = "etas_std" }
etas_utils = { git = "https://github.com/etas-project/etas-core.git", rev = "38d6491c565def47cf926b435dc5b5f87af30844", package = "etas_utils" }
etas_frontend = { git = "https://github.com/etas-project/etas-frontend.git", rev = "57e27628c4b73d0cfdfcb3f27e94b3477a946a40", package = "etas_frontend" }
etas_hir = { git = "https://github.com/etas-project/etas-frontend.git", rev = "57e27628c4b73d0cfdfcb3f27e94b3477a946a40", package = "etas_hir" }
etas_effects = { git = "https://github.com/etas-project/etas-frontend.git", rev = "57e27628c4b73d0cfdfcb3f27e94b3477a946a40", package = "etas_effects" }
etas_types = { git = "https://github.com/etas-project/etas-frontend.git", rev = "57e27628c4b73d0cfdfcb3f27e94b3477a946a40", package = "etas_types" }
blake3 = "1.8.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
